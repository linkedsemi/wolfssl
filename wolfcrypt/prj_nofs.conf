# Kernel options
CONFIG_MAIN_STACK_SIZE=20480
CONFIG_ENTROPY_GENERATOR=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=204800
# TLS configuration
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y
CONFIG_WOLFSSL_SETTINGS_FILE="wolfssl_user_settings_nofs.h"

CONFIG_WOLFSSL_TLS_VERSION_1_2=y
CONFIG_WOLFSSL_KEY_EXCHANGE_ALL_ENABLED=y
CONFIG_WOLFSSL_CIPHER_ALL_ENABLED=y
CONFIG_WOLFSSL_MAC_ALL_ENABLED=y
CONFIG_WOLFSSL_HMAC_DRBG_ENABLED=y



# Pthreads
CONFIG_PTHREAD_IPC=y

# Clock for time()
CONFIG_POSIX_CLOCK=y

# Network driver config
CONFIG_NETWORKING=n
# CONFIG_GPIO=n


CONFIG_TEST_RANDOM_GENERATOR=y
#linkedsemi hardware encryption

CONFIG_WOLFSSL_LINKEDSEMI_HARDWARE_SHA224_SHA256_SM3_ALT=n
CONFIG_WOLFSSL_LINKEDSEMI_HARDWARE_SHA384_SHA512_ALT=n
CONFIG_WOLFSSL_LINKEDSEMI_HARDWARE_SM4_ALT=y
CONFIG_WOLFSSL_LINKEDSEMI_HARDWARE_AES_ALT=y

CONFIG_WOLFSSL_LINKEDSEMI_OTBN_ECC_ALT=y
CONFIG_WOLFSSL_LINKEDSEMI_OTBN_RSA_ALT=y
CONFIG_WOLFSSL_LINKEDSEMI_OTBN_SHA224_SHA256_ALT=y
CONFIG_WOLFSSL_LINKEDSEMI_OTBN_SHA384_SHA512_ALT=y
CONFIG_WOLFSSL_LINKEDSEMI_OTBN_SM3_ALT=y
